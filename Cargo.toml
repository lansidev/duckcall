[package]
name = "duckcall"
version = "0.1.0"
edition = "2024"
description = "Mutes you in the call and ducks the output volume while you dictate with Handy"
repository = "https://github.com/lansidev/duckcall"

[dependencies]
libc = "0.2"
serde_json = "1"

# Only `install` reads and writes the call apps' stores, and it exists on macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
rusty-leveldb = "4"
